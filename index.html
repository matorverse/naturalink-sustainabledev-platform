<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/leaf-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="NaturalInk - AI-powered sustainable development platform for environmental awareness and eco-friendly living" />
    <meta name="keywords" content="sustainability, environment, AI, green living, eco-friendly, carbon footprint" />
    <title>NaturalInk - Sustainable Development Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 50%, #f0f9ff 100%);">
        <div style="text-align: center;">
          <div style="width: 64px; height: 64px; border: 4px solid #bbf7d0; border-top: 4px solid #16a34a; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
          <h2 style="font-size: 20px; font-weight: 600; color: #1f2937; margin-bottom: 8px;">Loading NaturalInk</h2>
          <p style="color: #6b7280;">Preparing your sustainability journey...</p>
        </div>
      </div>
    </div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
